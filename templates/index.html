<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission note generator</title>
    <!-- Bootstrap 4 CDN -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Admission note generator</h1>
        <p class="text-center">Please fill out the form below to generate an admission note.</p>
        
        <form action="/generate_report/" method="post" id="generateReportForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="api_key">API Key</label>
                <input type="text" class="form-control" id="api_key" name="api_key" required>
            </div>
            <div class="form-group">
                <label for="patient_id">Patient ID</label>
                <input type="text" class="form-control" id="patient_id" name="patient_id" required>
            </div>
            <div class="form-group">
                <label for="OPD_or_ER">OPD or ER</label>
                <select class="form-control" id="OPD_or_ER" name="OPD_or_ER" required>
                    <option value="OPD">OPD</option>
                    <option value="ER">ER</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Generate Report</button>
        </form>

        <!-- Loading Spinner -->
        <div id="loading" style="display: none;" class="text-center mt-3">
            <img src="https://i.gifer.com/YCZH.gif" alt="loading...">
            <p id="loadingMessage"></p>
        </div>

        <!-- Task Status Message -->
        <div id="taskStatusMessage" class="mt-3 text-center" style="display: none;">
            <p id="statusMessage"></p>
        </div>
    </div>

    <!-- Bootstrap 4 and jQuery CDN for form submission handling -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <script>
        // Handle the form submission
        $('#generateReportForm').submit(function(event) {
            event.preventDefault();  // Prevent default form submission
            var patientId = $('#patient_id').val()
            // Show the loading spinner
            $('#loading').show();
            $('#taskStatusMessage').hide();
            $('#loadingMessage').text('Processing' + patientId +'\'s admission note ');

            // Send the form data using AJAX
            $.ajax({
                type: 'POST',
                url: '/generate_report/',
                data: $(this).serialize(),
                success: function(response) {
                    // After submitting the form, get the task_id from the response
                    var taskId = response.task_id;
                    // Start polling the task status every 2 seconds
                    checkTaskStatus(taskId);
                },
                error: function() {
                    $('#loading').hide();
                    $('#taskStatusMessage').show();
                    $('#statusMessage').text('Error submitting the form. Please try again.');
                }
            });
        });

        // Function to check the status of the task
        function checkTaskStatus(taskId) {
            $.ajax({
                type: 'GET',
                url: `/task_status/${taskId}`,
                success: function(response) {
                    var status = response.status;
                    var patientId = $('#patient_id').val()

                    if (status[0] === "Completed") {
                        $('#loading').hide();
                        $('#taskStatusMessage').show();
                        $('#statusMessage').html(status[1]);
                    } else if (status === "Failed") {
                        $('#loading').hide();
                        $('#taskStatusMessage').show();
                        $('#statusMessage').text('Task failed. Please try again.');
                    } else {
                        // Continue polling every 2 seconds if the task is still in progress
                        setTimeout(function() {
                            checkTaskStatus(taskId);
                        }, 2000);
                    }
                },
                error: function() {
                    $('#loading').hide();
                    $('#taskStatusMessage').show();
                    $('#statusMessage').text('Error checking task status. Please try again.');
                }
            });
        }
    </script>
</body>
</html>
